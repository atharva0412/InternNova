<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Expense Tracker</title>
    <link rel="stylesheet" href="week6style.css">
</head>
<body>
    <header class="header">
        <h1>Smart Expense Tracker</h1>
    </header>

    <main class="container">
        <!-- Dashboard Summary (CSS Grid) -->
        <section class="dashboard">
            <div class="card">
                <h3>Total Expenses</h3>
                <h2 id="total-amount">$0.00</h2>
            </div>
        </section>

        <!-- Input Form -->
        <section class="form-section">
            <form id="expense-form">
                <input type="text" id="expense-name" placeholder="Expense Name (e.g., Coffee)">
                <input type="number" id="expense-amount" placeholder="Amount" step="0.01">
                <select id="expense-category">
                    <option value="Food">Food</option>
                    <option value="Transport">Transport</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Other">Other</option>
                </select>
                <button type="submit">Add Expense</button>
            </form>
            <p id="error-msg" class="hidden">Please fill out all fields with valid data.</p>
        </section>

        <!-- Filter and List -->
        <section class="list-section">
            <div class="list-header">
                <h3>Recent Transactions</h3>
                <select id="filter-category">
                    <option value="All">All Categories</option>
                    <option value="Food">Food</option>
                    <option value="Transport">Transport</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <ul id="expense-list">
                <!-- JavaScript will generate list items here -->
            </ul>
        </section>
    </main>

    <script src="week6app.js"></script>
</body>
</html>
